name: Publish DSH-SCNet

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Merged package version, for example 0.4.2"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish-dsh-scnet
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DSH-SCNet
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: Verify release branch and version
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version }}
        run: |
          test "${GITHUB_REF_NAME}" = "main"
          git fetch origin main --tags
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          PACKAGE_VERSION="$(node -p 'require("./package.json").version')"
          test "$PACKAGE_VERSION" = "$RELEASE_VERSION"
          if git rev-parse -q --verify "refs/tags/v${RELEASE_VERSION}" >/dev/null; then
            echo "v${RELEASE_VERSION} already exists" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm install --no-package-lock --ignore-scripts

      - name: Validate package
        run: npm run validate

      - name: Pack release artifact
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version }}
        run: |
          mkdir -p .release
          npm pack --pack-destination .release/
          RELEASE_TARBALL=".release/dsh-scnet-${RELEASE_VERSION}.tgz"
          test -f "$RELEASE_TARBALL"
          echo "RELEASE_TARBALL=$RELEASE_TARBALL" >> "$GITHUB_ENV"
          LOCAL_INTEGRITY="$(npm pack --json --dry-run | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s)[0].integrity))')"
          PUBLISHED_INTEGRITY="$(npm view "dsh-scnet@${RELEASE_VERSION}" dist.integrity 2>/dev/null || true)"
          if [ -n "$PUBLISHED_INTEGRITY" ]; then
            test "$LOCAL_INTEGRITY" = "$PUBLISHED_INTEGRITY"
            echo "SHOULD_PUBLISH=false" >> "$GITHUB_ENV"
          else
            echo "SHOULD_PUBLISH=true" >> "$GITHUB_ENV"
          fi

      - name: Publish to npm
        if: env.SHOULD_PUBLISH == 'true'
        run: npm publish "$RELEASE_TARBALL" --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Tag published release
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version }}
        run: |
          git tag "v${RELEASE_VERSION}"
          git push origin "v${RELEASE_VERSION}"
