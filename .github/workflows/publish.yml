name: Publish DSH-SCNet

on:
  workflow_run:
    workflows: ["Validate DSH-SCNet"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-dsh-scnet
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DSH-SCNet
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Setup npm Trusted Publishing client
        run: |
          npm install --global npm@latest
          npm --version

      - name: Verify synchronized version and release documents
        id: preflight
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "A newer main commit exists; its validation run will publish the release."
            echo "should-release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 .github/scripts/release_docs.py --check \
            --version-file skills/scnet-hpc/VERSION
          package_version="$(node -p 'require("./package.json").version')"
          skill_version="$(tr -d '[:space:]' < skills/scnet-hpc/VERSION)"
          test "$package_version" = "$skill_version"
          if [[ "$package_version" == *-* ]]; then
            echo "NPM_TAG=next" >> "$GITHUB_ENV"
          else
            echo "NPM_TAG=latest" >> "$GITHUB_ENV"
          fi
          echo "RELEASE_VERSION=$package_version" >> "$GITHUB_ENV"
          echo "should-release=true" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.preflight.outputs.should-release == 'true'
        run: npm install --no-package-lock --ignore-scripts

      - name: Validate package
        if: steps.preflight.outputs.should-release == 'true'
        run: npm run validate

      - name: Pack and compare release artifact
        if: steps.preflight.outputs.should-release == 'true'
        run: |
          mkdir -p .release
          npm pack --pack-destination .release/
          release_tarball=".release/dsh-scnet-${RELEASE_VERSION}.tgz"
          test -f "$release_tarball"
          echo "RELEASE_TARBALL=$release_tarball" >> "$GITHUB_ENV"
          local_integrity="$(npm pack --json --dry-run | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const value=JSON.parse(s); const item=Array.isArray(value) ? value[0] : value; console.log(item.integrity)})')"
          published_integrity="$(npm view "dsh-scnet@${RELEASE_VERSION}" dist.integrity 2>/dev/null || true)"
          if [ -n "$published_integrity" ]; then
            test "$local_integrity" = "$published_integrity"
            echo "SHOULD_PUBLISH=false" >> "$GITHUB_ENV"
          else
            echo "SHOULD_PUBLISH=true" >> "$GITHUB_ENV"
          fi

      - name: Publish to npm
        if: >-
          steps.preflight.outputs.should-release == 'true' &&
          env.SHOULD_PUBLISH == 'true'
        run: npm publish "$RELEASE_TARBALL" --access public --tag "$NPM_TAG" --provenance

      - name: Create tag and GitHub Release
        if: steps.preflight.outputs.should-release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${RELEASE_VERSION}"
          git fetch origin --tags
          if ! git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            git tag "$tag"
            git push origin "$tag"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "${tag} is already published"
            exit 0
          fi
          args=(release create "$tag" --verify-tag --title "dsh-scnet ${tag}" --notes-file RELEASE_HIGHLIGHTS.md "$RELEASE_TARBALL")
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}"
