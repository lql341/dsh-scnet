name: Publish DSH-SCNet

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: publish-dsh-scnet
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DSH-SCNet
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: Verify release tag
        run: |
          PACKAGE_VERSION="$(node -p 'require("./package.json").version')"
          test "${GITHUB_REF_NAME}" = "v${PACKAGE_VERSION}"

      - name: Install dependencies
        run: npm install --no-package-lock --ignore-scripts

      - name: Validate package
        run: npm run validate

      - name: Pack release artifact
        run: |
          mkdir -p .release
          npm pack --pack-destination .release/
          echo "RELEASE_TARBALL=.release/dsh-scnet-$(node -p 'require("./package.json").version').tgz" >> "$GITHUB_ENV"

      - name: Publish to npm
        run: npm publish "$RELEASE_TARBALL" --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
